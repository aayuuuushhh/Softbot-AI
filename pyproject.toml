[project]
name = "uddhar"
version = "0.1.0"
description = "Multi-modal disaster imagery to web-informed resource allocation"
requires-python = ">=3.11"

dependencies = [
    # --- API ---
    "fastapi>=0.138",
    "uvicorn[standard]>=0.34",
    "python-multipart>=0.0.20",
    "sse-starlette>=2.1",
    "pydantic>=2.13",
    "pydantic-settings>=2.7",

    # --- Database ---
    "motor>=3.7",
    "pymongo>=4.18",

    # --- Vision / geospatial ---
    # torch + torchvision are installed separately from the cu124 index,
    # see scripts/setup_env.sh. Versions MUST stay paired: 2.6.0 <-> 0.21.0
    "opencv-python>=4.10",
    "rasterio>=1.4",
    "pyproj>=3.6",
    "shapely>=2.0",
    "numpy>=2.0",
    "pillow>=11.0",

    # --- Graph ---
    "torch-geometric>=2.6",
    "networkx>=3.4",

    # --- Agents ---
    "langchain>=1.4",
    "langchain-anthropic>=1.7",
    "langchain-tavily>=0.2",
    "anthropic>=0.70",

    # --- Reporting ---
    "reportlab>=4.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "hypothesis>=6.120",
    "httpx>=0.28",
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["core", "core.vision", "core.spatial", "agents", "api", "api.routes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI Depends() in defaults
